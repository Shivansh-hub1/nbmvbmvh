name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A pull request only needs to prove the site builds — no secrets required.
jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Placeholder values — the build never calls Supabase, only the
          # /api/enquiry route at request time needs real credentials.
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
